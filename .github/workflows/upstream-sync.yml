name: Upstream Sync & Zero-Spillover PR Automation

on:
  schedule:
    # 每周一 UTC 04:00 自动巡检（北京时间 12:00）
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      target:
        description: '选择要同步的上游仓库 (apk-reverse / open-tgtylab / open-reverselab / all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - apk-reverse
          - open-tgtylab
          - open-reverselab

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Seep-Reverse-Lab
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git Author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Boundary Unit Tests
        run: |
          python setup/test_sync_upstream.py

      - name: Process Upstream Targets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHOSEN_TARGET: ${{ github.event.inputs.target || 'all' }}
        run: |
          TARGETS=("apk-reverse" "open-tgtylab" "open-reverselab")
          if [ "$CHOSEN_TARGET" != "all" ]; then
            TARGETS=("$CHOSEN_TARGET")
          fi

          for TARGET in "${TARGETS[@]}"; do
            echo "========================================================"
            echo "正在巡检上游: $TARGET"
            echo "========================================================"

            # 1. 检查是否有更新
            set +e
            python setup/sync-upstream.py --target "$TARGET" --check-only
            CHECK_EXIT=$?
            set -e

            if [ $CHECK_EXIT -eq 0 ]; then
              echo "[$TARGET] 已是最新版本，无需同步。"
              continue
            fi

            echo "[$TARGET] 检测到上游新提交，开始隔离拉取..."
            BRANCH_NAME="sync/upstream-${TARGET}-$(date +%Y%m%d)"

            # 切出独立隔离分支
            git checkout -b "$BRANCH_NAME"

            # 执行定点拉取
            python setup/sync-upstream.py --target "$TARGET"

            # 2. 严格校验文件改动范围（防外溢断言）
            echo "正在对 git 状态执行防外溢断言..."
            CHANGED_FILES=$(git status --porcelain | awk '{print $2}')
            BOUNDARY="Tool/upstream/${TARGET}/"

            for FILE in $CHANGED_FILES; do
              if [[ "$FILE" != "$BOUNDARY"* && "$FILE" != "setup/.upstream-shas.json" ]]; then
                echo "::error::[FATAL] 检测到文件改动外溢出目标目录: $FILE (期望前缀: $BOUNDARY)"
                exit 1
              fi
            done
            echo "防外溢断言通过: 所有改动均严格局限在 $BOUNDARY 内！"

            # 3. 运行格式规范化
            python setup/clean-format.py

            # 4. 提交并推送
            git add .
            if git diff --staged --quiet; then
              echo "无实际文件内容变动，跳过提交。"
              git checkout main
              git branch -D "$BRANCH_NAME"
              continue
            fi

            COMMIT_MSG="chore(upstream): sync ${TARGET} to latest upstream (sandboxed)"
            git commit -m "$COMMIT_MSG"
            git push origin "$BRANCH_NAME" --force

            # 5. 创建独立 PR
            PR_BODY="## 📦 上游定点同步公告 (${TARGET})

### 🛡️ 边界隔离保障
- **专属纳入目录**: \`Tool/upstream/${TARGET}/\`
- **防外溢守卫 (Zero-Spillover Gate)**: ✅ 已执行严格绝对路径断言，无任何其他目录受到波及。
- **本地定制保全**: \`README.md\` 与脱敏标识保留。
- **单元测试**: \`setup/test_sync_upstream.py\` 100% 通过。

请维护者审阅文件 Diff 后合入 \`main\`。"

            # 如果 PR 已存在则更新，不存在则创建
            EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --json number --jq '.[0].number')
            if [ -n "$EXISTING_PR" ]; then
              echo "已存在针对分支 $BRANCH_NAME 的 PR (#$EXISTING_PR)，无需重复创建。"
            else
              gh pr create \
                --title "$COMMIT_MSG" \
                --body "$PR_BODY" \
                --base main \
                --head "$BRANCH_NAME"
              echo "成功创建针对 $TARGET 的隔离同步 PR！"
            fi

            git checkout main
          done
